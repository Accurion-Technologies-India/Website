name: Accurion Static Builder & Deployer

on:
  push:
    branches:
      - main
    paths:
      - 'data/**'
      - 'images/uploads/**'
      - 'scripts/**'
      - 'index.html'

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow beautifulsoup4

      - name: 1. Validate Data Models & References
        run: |
          python scripts/validate_data.py

      - name: 2. Process Uploaded Images (4-Layer Defense)
        run: |
          python scripts/process_images.py

      - name: 3. Compile Static HTML Pages & Sitemap
        run: |
          python scripts/build_site.py

      - name: 4. Commit and Push Generated Static Assets
        run: |
          git config --global user.name "Accurion Static Builder"
          git config --global user.email "bot@accuriontechnologies.com"

          git add products/ sitemap.xml images/uploads/
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No site build changes detected. Everything is up-to-date."
          else
            git commit -m "Auto-compile static catalogue pages & sitemap [skip ci]"
            git push origin main
          fi
